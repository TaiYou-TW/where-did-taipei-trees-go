  <rect class="trunk" x="29.6" y="34" width="4.8" height="21" rx="2.4"/>
  <g class="leaf">
    <circle cx="32" cy="24" r="15"/>
    <circle cx="19" cy="29.5" r="9.6"/>
    <circle cx="45" cy="29.5" r="9.6"/>
    <circle cx="24" cy="15.5" r="8.4"/>
