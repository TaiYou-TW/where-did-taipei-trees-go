<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="樹都去哪了">
  <title>樹都去哪了</title>
  <style>
    .leaf{fill:#1c7a4b}
